name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sistema
          POSTGRES_USER: sistema
          POSTGRES_PASSWORD: sistema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistema"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sistema:sistema@localhost:5432/sistema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - run: pytest -q
      - name: Tipos de TypeScript al día con el OpenAPI
        working-directory: frontend
        run: |
          npm run tipos:api
          git diff --exit-code src/app/core/api/esquema.d.ts || {
            echo "esquema.d.ts no está al día: ejecuta npm run tipos:api en frontend/ y commitea el resultado."
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Estilo (prettier y eslint)
        run: |
          npm run format:check
          npm run lint
      - run: npx ng test --watch=false
      - run: npm run build

  planeacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: PlanMVP.md coincide con sprints.json y user-stories/
        run: |
          python3 docs/herramientas/generar_plan.py --sin-pdf --estricto
          git diff --exit-code docs/planning/PlanMVP.md || {
            echo "PlanMVP.md no está al día: ejecuta python3 docs/herramientas/generar_plan.py y commitea el resultado."
            exit 1
          }
