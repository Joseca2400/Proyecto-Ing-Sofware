<header class="topbar">
  <a routerLink="/inicio" class="brand">
    <span class="milestone" aria-hidden="true">
      <span class="milestone-top">KM</span>
      <span class="milestone-body">0</span>
    </span>
    <strong>Kilómetro Cero</strong>
  </a>
  @if (usuario(); as actual) {
    <div class="sesion">
      <span>{{ actual.nombre }} · {{ rol() }}</span>
      <button type="button" (click)="salir()">Cerrar sesión</button>
    </div>
  }
</header>

<div class="cuerpo">
  <nav class="menu" aria-label="Módulos">
    @for (entrada of menu(); track entrada.etiqueta) {
      @if (entrada.ruta) {
        <a
          [routerLink]="entrada.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: true }"
          >{{ entrada.etiqueta }}</a
        >
      } @else {
        <span class="grupo">{{ entrada.etiqueta }}</span>
      }
    }
  </nav>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
